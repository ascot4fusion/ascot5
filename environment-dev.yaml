name: ascot-dev
channels:
  - conda-forge
dependencies:
  - c-compiler
  - llvm-openmp
  - python>=3.12
  - make
  - pip
  - numpy>=2.0
  - unyt
  - scipy
  - h5py
  - mpi=*=*openmpi*
  - mpi4py
  - xmlschema
  - ipython
  - matplotlib
  - pyvista
  - ipykernel
  - pandoc
  - sphinx==9.*
  - numpydoc
  - nbsphinx
  - nbformat
  - sphinxcontrib-bibtex
  - sphinx-rtd-theme
  - sphinx-gallery
  - sphinx-design
  - doxygen
  - libsanitizer
  - pylint
  - mypy
  - pytest
  - pip:
    - "breathe>=5"
    - tomli_w
    - sphinx-multiproject
    - sphinx-design-elements
    - pytest-mpi
    - pytest-mpl
