general:
  report_frequency: 10
  verbose: 1

model:
  type: mlp
  parameters:
    layer_sizes: [3, 256, 256, 128, 3]
    dropout: 0.0

loss:
  type: mse

optimizer:
  type: adam
  parameters:
    learning_rate: 1.0e-4
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.0
    amsgrad: false

lr_scheduler:
  type: cosine_annealing
  parameters:
    T_max: 100000