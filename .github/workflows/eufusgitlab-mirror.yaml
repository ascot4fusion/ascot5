name: Mirror to GitLab

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

jobs:
  mirror:
    concurrency:
      group: ${{ github.workflow }}-gitlab
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository
        env:
          GITLAB_USERNAME: ${{ secrets.EUFUSGITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.EUFUSGITLAB_TOKEN }}
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git push --mirror "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@gitlab.eufus.psnc.pl/g2ksarki/ascot5.git"